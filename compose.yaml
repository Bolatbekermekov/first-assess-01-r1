# Dev-only environment for FIRST-ASSESS-01. NOT part of the return package: RETURN_INSTRUCTIONS.md does not allow it
# and the module itself needs nothing but `python` 3.12 and its standard library.
#   docker compose run --rm -T py python RUN_ACCEPTANCE.py
#   docker compose run --rm -T py python -m unittest discover -s tests -p "test_candidate_*.py" -v
#   docker compose --profile tools run --rm -T tools mypy --strict assess_workbench
name: first-assess-01

x-sandbox: &sandbox
  working_dir: /work
  volumes:
    - .:/work
  user: "1000:1000"
  network_mode: none
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  environment:
    HOME: /tmp
    PYTHONDONTWRITEBYTECODE: "1"
    PYTHONUNBUFFERED: "1"
    RUFF_NO_CACHE: "true"
    MYPY_CACHE_DIR: /tmp/.mypy_cache

services:
  py:
    <<: *sandbox
    image: python:3.12.13-slim-trixie@sha256:229a2c5bfa27522db7815ea81f9bed70af17ccb9de9fc7ad142b1877b5830d36
  tools:
    <<: *sandbox
    profiles: ["tools"]
    image: first-assess-01-tools:local
    build:
      context: ./dev
      dockerfile_inline: |
        FROM python:3.12.13-slim-trixie@sha256:229a2c5bfa27522db7815ea81f9bed70af17ccb9de9fc7ad142b1877b5830d36
        RUN pip install --no-cache-dir ruff==0.17.0 mypy==2.4.0
